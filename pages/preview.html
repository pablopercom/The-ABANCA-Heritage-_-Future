/* ── Renderizar ── */
const params = new URLSearchParams(location.search);
const id = params.get('c');
const comp = C[id];

if (comp) {
  document.title = comp.name + ' · Preview · ABANCA DS';
  document.getElementById('pv-name').textContent = comp.name;
  document.getElementById('pv-group').textContent = comp.group;
  document.getElementById('pv-cls').textContent = comp.cls;
  document.getElementById('pv-content').innerHTML = comp.html;
} else {
  // Índice de componentes si no hay ?c=
  document.getElementById('pv-name').textContent = 'Índice de componentes';
  document.getElementById('pv-content').innerHTML = `
    <div style="padding:80px;max-width:900px">
      <div class="eyebrow" style="margin-bottom:40px"><span>Todos los componentes</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
        ${Object.entries(C).map(([key, c]) => `
          <a href="preview.html?c=${key}" style="
            display:flex;flex-direction:column;gap:6px;padding:18px 20px;
            border:1px solid var(--line);text-decoration:none;color:inherit;
            transition:border-color .2s,background .2s;
          " onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--paper-2)'"
             onmouseout="this.style.borderColor='var(--line)';this.style.background='transparent'">
            <span style="font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep)">${c.group}</span>
            <span style="font-family:var(--serif);font-size:20px;letter-spacing:-.01em">${c.name}</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--mid)">${c.cls}</span>
          </a>`).join('')}
      </div>
    </div>`;
}

/* ── JS de secciones (stats + manifesto + timeline) ── */
window.addEventListener('DOMContentLoaded', () => {
  // Manifesto
  const mfWords = document.querySelectorAll('#manifesto-text .word');
  if (mfWords.length) {
    function onMfScroll() {
      const sec = document.getElementById('manifesto');
      if (!sec) return;
      const rect = sec.getBoundingClientRect();
      const total = mfWords.length;
      const start = window.innerHeight * 0.85, end = window.innerHeight * 0.15;
      const prog = Math.max(0, Math.min(1, (start - rect.top) / (start - end + rect.height * 0.4)));
      mfWords.forEach((w, i) => w.classList.toggle('on', i < Math.floor(prog * total)));
    }
    window.addEventListener('scroll', onMfScroll, { passive: true });
    onMfScroll();
  }

  // Stats
  const statsWrap = document.querySelector('.stats-wrap');
  if (statsWrap) {
    const statsCells = document.querySelectorAll('.stats .grid .cell .num');
    const statsBar = document.getElementById('statsBar');
    const targets = Array.from(statsCells).map(el => ({ el, target: parseFloat(el.dataset.target), dec: parseInt(el.dataset.decimals || '0', 10) }));
    function onStatsScroll() {
      const rect = statsWrap.getBoundingClientRect();
      const total = statsWrap.offsetHeight - window.innerHeight;
      const p = Math.max(0, Math.min(1, -rect.top / total));
      targets.forEach(({ el, target, dec }, i) => {
        const start = i * 0.12, end = start + 0.5;
        const lp = Math.max(0, Math.min(1, (p - start) / (end - start)));
        const v = target * (1 - Math.pow(1 - lp, 3));
        el.textContent = dec > 0 ? v.toFixed(dec).replace('.', ',') : Math.round(v).toLocaleString('es-ES');
      });
      if (statsBar) statsBar.style.setProperty('--p', (p * 100) + '%');
    }
    window.addEventListener('scroll', onStatsScroll, { passive: true });
    onStatsScroll();
  }

  // Timeline
  const tlWrap = document.querySelector('.timeline-wrap');
  if (tlWrap) {
    const tlTrack = document.getElementById('tlTrack');
    const tlBar = document.getElementById('tlBar');
    const tlYear = document.getElementById('tlYear');
    const tlProgress = document.getElementById('tlProgress');
    const tlItems = tlTrack ? Array.from(tlTrack.querySelectorAll('.item')) : [];
    if (tlProgress && tlItems.length) {
      tlItems.forEach((it, i) => {
        const pip = document.createElement('div');
        pip.className = 'pip';
        pip.style.left = (i / (tlItems.length - 1) * 100) + '%';
        const label = document.createElement('span');
        label.className = 'pip-lbl';
        label.textContent = it.querySelector('.year')?.textContent || '';
        pip.appendChild(label);
        tlProgress.appendChild(pip);
      });
    }
    function onTlScroll() {
      const rect = tlWrap.getBoundingClientRect();
      const total = tlWrap.offsetHeight - window.innerHeight;
      const p = Math.max(0, Math.min(1, -rect.top / total));
      const idx = Math.round(p * (tlItems.length - 1));
      if (tlYear) tlYear.textContent = tlItems[idx]?.querySelector('.year')?.textContent || '';
      if (tlBar) tlBar.style.setProperty('--p', (p * 100) + '%');
      if (tlTrack) {
        const maxScroll = tlTrack.scrollWidth - tlTrack.parentElement.offsetWidth;
        tlTrack.style.transform = `translateX(${-(p * maxScroll)}px)`;
      }
      document.querySelectorAll('.timeline-wrap .progress .pip').forEach((pip, i) => pip.classList.toggle('active', i === idx));
    }
    window.addEventListener('scroll', onTlScroll, { passive: true });
    onTlScroll();
  }
});
</script>
